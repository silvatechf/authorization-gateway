name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  security-gate:
    name: Lint, type-check, test, scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Mypy (type check)
        run: mypy app

      - name: Pytest (unit + integration + security)
        run: pytest -v

      - name: Bandit (static security analysis)
        run: bandit -r app -q

      - name: pip-audit (dependency vulnerability scan)
        run: pip-audit -r requirements.txt

      - name: Docker build (deployability check)
        run: docker build -t authorization-gateway:ci .
