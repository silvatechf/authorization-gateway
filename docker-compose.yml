services:
  authorization-gateway:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    volumes:
      - devkeys:/app/.devkeys
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  devkeys:
