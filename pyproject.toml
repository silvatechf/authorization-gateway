[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = [
    "S101",  # assert is expected/required in pytest test files
    "B008",  # FastAPI's Depends(...) as an argument default is the documented pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]  # asserts + literal test secrets/tokens are fine in tests
"scripts/*" = ["S105", "S106"]
"app/data/store.py" = ["S106"]  # obviously-fake demo seed values, not real secrets

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["tests/"]

[tool.bandit]
exclude_dirs = ["tests", ".devkeys"]
